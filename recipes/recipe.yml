---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: brodyos
description: BrodyOS, my personal OS image.

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    group-install:
      packages:
        - xfce-desktop
    install:
      packages:
        - lightdm
        - python3.12
        - python3-pip
        - python3-pyqt6
        - python3-pillow
        - python3-jupyterlab
        - git
        - micro
        - ffmpeg-free
        - htop
        - openssh-server

  - type: systemd
    system:
      enabled:
        - lightdm.service
        - sshd.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.google.Chrome
          - com.visualstudio.code
          - com.jeffser.Alpaca
          - org.prismlauncher.PrismLauncher
          - org.videolan.VLC
          - org.gnome.Loupe
      - scope: user

  - type: signing
